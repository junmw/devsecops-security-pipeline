name: DevSecOps Secrets Guardrail

on: [push]

jobs:
  scan-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Fetch current repo files
        uses: actions/checkout@4.2.2
        with:
          fetch-depth: 0

      - name: 2. Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKE}}
